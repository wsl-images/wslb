name: Compatibility Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
  push:
    branches:
      - main
    paths:
      - "internal/targets/wsl/**"
      - "scripts/base-image-matrix.ps1"
      - "scripts/oobe-matrix.ps1"
      - "scripts/update-readme-compatibility.ps1"
      - ".github/workflows/compatibility-matrix.yml"

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Base Image Matrix
        id: base_matrix
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          ./scripts/base-image-matrix.ps1 -Out artifacts/base-image-matrix-report.json

      - name: Run OOBE Matrix
        id: oobe_matrix
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          ./scripts/oobe-matrix.ps1 -Out artifacts/wsl-images-oobe-matrix-report.json

      - name: Update README Compatibility Section
        if: always()
        shell: pwsh
        run: |
          ./scripts/update-readme-compatibility.ps1 `
            -BaseImageReport artifacts/base-image-matrix-report.json `
            -OOBEReport artifacts/wsl-images-oobe-matrix-report.json `
            -ReadmePath README.md

      - name: Upload Compatibility Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-reports
          path: artifacts/*.json
          if-no-files-found: warn

      - name: Commit README Update
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update compatibility matrix results [skip ci]"
          git push

      - name: Fail if Matrix Contains Regressions
        if: steps.base_matrix.outcome != 'success' || steps.oobe_matrix.outcome != 'success'
        shell: bash
        run: |
          echo "Compatibility matrix run failed. See uploaded reports and logs."
          exit 1
